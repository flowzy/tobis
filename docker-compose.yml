services:
  bot:
    container_name: bot
    image: oven/bun:1.2.22
    restart: always
    volumes:
      - .:/home/bun/app
    entrypoint: bun run --install=auto ./bot/main.ts

  lavalink:
    container_name: lavalink
    image: ghcr.io/lavalink-devs/lavalink:4.0.6
    restart: always
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    ports:
      - "2333:2333"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=2333

  cipher:
    container_name: cipher
    image: ghcr.io/kikkia/yt-cipher:master
    restart: always
    ports:
      - "8001:8001"

networks:
  default:
